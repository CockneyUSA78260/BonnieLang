<!DOCTYPE html>
<html lang="en" data-theme="luxury">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shows | Bonnie Lang</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script charset="utf-8" src="https://widget.bandsintown.com/main.min.js"></script>
</head>
<body class="min-h-screen bg-base-100 text-base-content font-sans">
    <div class="navbar bg-base-100/95 backdrop-blur sticky top-0 z-50 px-4 md:px-12 border-b border-white/5">
        <div class="navbar-start"><a href="index.html" class="text-2xl font-serif font-bold tracking-widest uppercase text-white">Bonnie Lang</a></div>
        <div class="navbar-end gap-4">
            <div class="hidden md:flex gap-3 text-xl">
                <a href="https://www.facebook.com/BonnieLangBand/" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-facebook"></i></a>
                <a href="https://www.tiktok.com/@bonnielangmusic" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-tiktok"></i></a>
                <a href="https://www.youtube.com/@BonnieLangMusic?sub_confirmation=1" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-youtube"></i></a>
                <a href="https://www.instagram.com/bonnielang/" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-instagram"></i></a>
            </div>
            <a href="index.html" class="btn btn-ghost btn-sm">Back to Home</a>
        </div>
    </div>
    <main class="container mx-auto px-4 py-20 max-w-4xl">
        <h1 class="text-5xl font-serif font-bold mb-12 text-center text-white italic">Upcoming Shows</h1>
        <div class="bg-white/5 p-8 rounded-3xl shadow-2xl border border-white/10">
            <a class="bit-widget-initializer"
               data-artist-name="Bonnie Lang"
               data-display-local-dates="false"
               data-display-past-dates="false"
               data-auto-style="false"
               data-text-color="#FFFFFF"
               data-link-color="#D4AF37"
               data-background-color="rgba(0,0,0,0)"
               data-display-limit="15"
               data-display-lineup="false"
               data-display-play-my-city="true"
               data-separator-color="#FFFFFF33"></a>
        </div>
    </main>
    <footer class="footer footer-center p-10 bg-neutral text-neutral-content border-t border-primary/20">
        <nav><div class="grid grid-flow-col gap-6 text-3xl">
            <a href="https://www.facebook.com/BonnieLangBand/" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-facebook"></i></a>
            <a href="https://www.tiktok.com/@bonnielangmusic" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-tiktok"></i></a>
            <a href="https://www.youtube.com/@BonnieLangMusic?sub_confirmation=1" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-youtube"></i></a>
            <a href="https://www.instagram.com/bonnielang/" target="_blank" rel="noopener" class="hover:text-primary transition-colors"><i class="fab fa-instagram"></i></a>
        </div></nav>
        <p class="opacity-40 text-xs mt-4">&copy; 2026 Bonnie Lang. All Rights Reserved.</p>
    </footer>
</body>
</html>
